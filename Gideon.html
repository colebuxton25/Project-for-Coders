<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Gideon Files
</title>
<style>
  :root {
    --bg: #f7f5f2;
    --card-bg: #ffffff;
    --text: #2b2b2b;
    --muted: #7a7a7a;
    --border: #e5e1db;
    --star-off: #d9d4cb;
    --star-on: #e0a63d;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1a17;
      --card-bg: #26231f;
      --text: #f1ede6;
      --muted: #a39a8c;
      --border: #3a352e;
      --star-off: #4a453d;
      --star-on: #e0a63d;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1a17;
    --card-bg: #26231f;
    --text: #f1ede6;
    --muted: #a39a8c;
    --border: #3a352e;
    --star-off: #4a453d;
    --star-on: #e0a63d;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 32px 16px 48px;
  }
  h1 {
    text-align: center;
    font-size: 1.5rem;
    font-weight: 600;
    margin: 0 0 28px;
    letter-spacing: -0.01em;
  }
  .gallery {
    display: flex;
    flex-direction: column;
    gap: 28px;
    max-width: 480px;
    margin: 0 auto;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }
  .card img {
    display: block;
    width: 100%;
    max-width: 100%;
    height: auto;
  }
  .card-footer {
    padding: 14px 16px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .stars {
    display: flex;
    gap: 4px;
  }
  .star {
    background: none;
    border: none;
    padding: 2px;
    cursor: pointer;
    line-height: 1;
    font-size: 28px;
    color: var(--star-off);
    transition: color 0.12s ease, transform 0.08s ease;
  }
  .star:active { transform: scale(0.92); }
  .star.on { color: var(--star-on); }
  .rating-label {
    font-size: 0.8rem;
    color: var(--muted);
    min-height: 1.2em;
  }
</style>
</head>

<script>
(function () {
  var photos = ['photo1', 'photo2'];

  function getRating(id) {
    try {
      var v = localStorage.getItem('rating:' + id);
      return v ? parseInt(v, 10) : 0;
    } catch (e) { return 0; }
  }

  function setRating(id, value) {
    try {
      localStorage.setItem('rating:' + id, String(value));
    } catch (e) {}
  }

  function render(id) {
    var container = document.querySelector('.stars[data-photo="' + id + '"]');
    var label = document.querySelector('.rating-label[data-label="' + id + '"]');
    var current = getRating(id);
    container.innerHTML = '';
    for (var i = 1; i <= 5; i++) {
      (function (i) {
        var btn = document.createElement('button');
        btn.className = 'star' + (i <= current ? ' on' : '');
        btn.setAttribute('aria-label', i + ' star' + (i > 1 ? 's' : ''));
        btn.textContent = '★';
        btn.addEventListener('click', function () {
          setRating(id, i);
          render(id);
        });
        container.appendChild(btn);
      })(i);
    }
    label.textContent = current > 0 ? (current + ' / 5') : 'Not yet rated';
  }

  photos.forEach(render);
})();
</script>
